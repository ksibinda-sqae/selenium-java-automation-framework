name: Demo Web Shop Pipeline

on:
  schedule:
    - cron: '0 18 * * *'

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        env:
          CI: true
          REGISTRATION_PASSWORD: ${{ secrets.REGISTRATION_PASSWORD }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}

        run: mvn --batch-mode clean test